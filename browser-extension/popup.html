<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Living Bread</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFFFFF 100%);
      color: #1a1a1a;
    }

    .header {
      background: linear-gradient(135deg, #FFB040 0%, #F59E0B 100%);
      padding: 20px;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .stats-container {
      padding: 20px;
    }

    .main-stat {
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .main-stat .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .main-stat .value {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, #E69A30 0%, #CC8420 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-stat .unit {
      font-size: 16px;
      color: #666;
    }

    .activities {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .activities h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #FFB040 0%, #F59E0B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      color: white;
      font-size: 16px;
    }

    .activity-info {
      flex: 1;
    }

    .activity-title {
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .activity-source {
      font-size: 11px;
      color: #888;
    }

    .activity-duration {
      font-size: 12px;
      font-weight: 600;
      color: #E69A30;
    }

    .scripture {
      padding: 16px 20px;
      text-align: center;
      font-style: italic;
      color: #666;
      font-size: 12px;
      background: #FFF8F0;
      border-top: 1px solid #FFE0B3;
    }

    .scripture cite {
      display: block;
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      font-style: normal;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #888;
    }

    .empty-state p {
      font-size: 13px;
    }

    .cta-button {
      display: block;
      background: linear-gradient(135deg, #FFB040 0%, #F59E0B 100%);
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      margin: 16px 20px;
    }

    .cta-button:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>The Living Bread</h1>
    <p>Time with Christ Today</p>
  </div>

  <div class="stats-container">
    <div class="main-stat">
      <div class="label">Time with Christ Today</div>
      <div>
        <span class="value" id="todayMinutes">0</span>
        <span class="unit">min</span>
      </div>
    </div>

    <div class="activities">
      <h3>Recent Activity</h3>
      <div id="activityList">
        <div class="empty-state">
          <p>Start browsing Christian content to track your time with Christ.</p>
        </div>
      </div>
    </div>
  </div>

  <a href="https://thelivingbread.org/dashboard" target="_blank" class="cta-button">
    View Full Dashboard
  </a>

  <div class="scripture">
    "But seek first his kingdom and his righteousness, and all these things will be given to you as well."
    <cite>— Matthew 6:33</cite>
  </div>

  <script src="popup.js"></script>
</body>
</html>
